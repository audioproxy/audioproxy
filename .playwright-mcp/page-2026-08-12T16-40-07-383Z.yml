      - paragraph [ref=e494]: "A source carrying a genuine video stream is refused with 415 before any render starts. It is a reject, not a strip: pulling the audio track out of arbitrary video would make this a free transcoding service at video's cost profile and video's exposure, which is a different product. Embedded cover art is metadata and renders normally."
  - generic [ref=e496]:
    - generic [ref=e497]: 03 · Response semantics
    - heading "The first request streams. Every one after it seeks." [level=2] [ref=e498]
    - paragraph [ref=e499]: The same URL is framed differently depending on what is cached, so a client implements both. That is the whole contract, and it does not change with the storage backend or the serve mode.
    - generic [ref=e500]:
      - generic [ref=e501]:
        - generic [ref=e502]: Miss
        - heading "Rendered while you download it" [level=3] [ref=e503]
        - paragraph [ref=e504]: 200 with chunked framing and no Content-Length. Bytes leave as the encoder produces them and are teed to the variant store at the same time. Concurrent requests for one cache key coalesce onto a single render and all subscribe to its stream.
        - generic [ref=e505]: "X-Audio-Proxy: MISSX-Audio-Proxy: COALESCED"
      - generic [ref=e506]:
        - generic [ref=e507]: Hit
        - heading "Range capable, and out of the hot path" [level=3] [ref=e508]
        - paragraph [ref=e509]: By default a hit is a 302 to a presigned variant URL, and storage serves the ranges. In proxy mode the proxy relays the object itself with Content-Length and Accept-Ranges. Either way seeking works, which is the part players care about.
        - generic [ref=e510]: "X-Audio-Proxy: HITAccept-Ranges: bytes"
      - generic [ref=e511]:
        - generic [ref=e512]: Immutable
        - heading "The URL encodes the bytes" [level=3] [ref=e513]
        - paragraph [ref=e514]: A variant is fully described by its options, so it can never go stale. Every response states its own cache policy, success or error, and no CDN default gets to decide retention.
        - generic [ref=e515]: "Cache-Control: public,max-age=31536000, immutable,no-transform"
