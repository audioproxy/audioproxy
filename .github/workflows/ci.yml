name: CI

on:
  push:
    branches: [main]
    # Release tags run the same pipeline as any other push; the publish job at
    # the bottom is what reads the tag and turns it into version tags.
    tags: ['v*']
  pull_request:

env:
  MIX_ENV: test
  IMAGE_NAME: ghcr.io/audioproxy/audioproxy

jobs:
  test:
    name: format, compile, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Versions come from .tool-versions, the same pin mise reads locally.
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      - run: mix format --check-formatted

      - run: mix compile --warnings-as-errors

      # MinIO backs the :minio suite, which is where the S3 layer is checked
      # against a store that actually verifies signatures. Started with
      # `docker run` rather than as a `services:` container because the minio
      # image needs a command (`server /data`) and the services block has
      # nowhere to put one.
      - name: Start MinIO
        run: |
          set -euo pipefail

          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO is up"
              exit 0
            fi
            sleep 1
          done

          echo "::error::MinIO did not become healthy"
          docker logs minio
          exit 1

      # `--include integration` adds the socket-binding tests; `--include
      # minio` adds the ones needing the store above. :ffmpeg stays excluded
      # (that tag has its own job below).
      - run: mix test --include integration --include minio
        env:
          AP_TEST_MINIO_ENDPOINT: http://127.0.0.1:9000

  # ---------------------------------------------------------------------------
  # Image verification. Both jobs build from the same Dockerfile and share a
  # buildx layer cache, so the second one to run pays for very little.
  # ---------------------------------------------------------------------------

  image-ffmpeg:
    name: ffmpeg-tagged tests against the shipped ffmpeg
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The runtime image is built here too, only so its ffmpeg can be compared
      # against the test stage's. That comparison is the whole point of the job:
      # the argv contract has to be checked against the binary that ships, not
      # against whatever the runner's apt happens to hold.
      - name: Build test stage
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          load: true
          tags: audio_proxy:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build runtime stage
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          tags: audio_proxy:runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert the tested ffmpeg is the shipped ffmpeg
        run: |
          set -euo pipefail
          # Captured whole, then sliced to the first line with parameter
          # expansion. Piping into `head -1` closes the pipe after one line,
          # ffmpeg dies of EPIPE partway through its banner, docker exits
          # non-zero, and `pipefail` turns that into a failed step — a failure
          # about plumbing that reads exactly like a failed assertion.
          test_ffmpeg=$(docker run --rm --entrypoint ffmpeg audio_proxy:test -version)
          ship_ffmpeg=$(docker run --rm --entrypoint ffmpeg audio_proxy:runtime -version)
          test_ffmpeg=${test_ffmpeg%%$'\n'*}
          ship_ffmpeg=${ship_ffmpeg%%$'\n'*}
          echo "test stage:    $test_ffmpeg"
          echo "runtime stage: $ship_ffmpeg"
          if [ "$test_ffmpeg" != "$ship_ffmpeg" ]; then
            echo "::error::test and runtime stages ship different ffmpeg builds — check DEBIAN_VERSION in the Dockerfile"
            exit 1
          fi

          # VERSIONS.md is the single record of the pin; a bump that moves the
          # major has to move that file too, deliberately. The FFMPEG_MAJOR line
          # exists to be parsed — matching prose instead once meant reading a
          # restatement of the number rather than the number itself.
          expected=$(grep -oE '^[[:space:]]*FFMPEG_MAJOR=[0-9]+$' VERSIONS.md | grep -oE '[0-9]+$')
          actual=$(printf '%s' "$ship_ffmpeg" | grep -oE 'ffmpeg version [0-9]+' | grep -oE '[0-9]+$')
          echo "expected major: $expected, actual: $actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::ffmpeg major $actual does not match the $expected pinned in VERSIONS.md"
            exit 1
          fi

      - name: Run :ffmpeg-tagged tests in the image
        run: docker run --rm audio_proxy:test mix test --only ffmpeg

  smoke:
    name: container smoke suite
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the release image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          tags: audio_proxy:smoke
          # The smoke image is never pushed, so its version label only has to be
          # non-empty for the label check; the publish job computes the real one.
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Ruby is preinstalled on ubuntu-latest; the script needs no gems, and it
      # takes its ffmpeg from the image rather than the runner.
      - name: Run the smoke suite
        run: SKIP_BUILD=1 IMAGE=audio_proxy:smoke bin/smoke-image

  capacity:
    name: the published memory model holds
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Before the image build, because it needs neither docker nor ffmpeg and
      # takes under a second: the matrix at the top of docs/capacity.md is the
      # model inverted, so every published cell has to fit the limit it is
      # printed under, and one more slot has to not fit. An inversion that has
      # drifted publishes a memory limit that is too small, which is the failure
      # mode an operator discovers as an OOM kill.
      - name: Check the published matrix inverts the model
        run: bin/capacity-matrix --verify

      - uses: docker/setup-buildx-action@v4

      - name: Build the release image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          tags: audio_proxy:capacity
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The guard reads a container's own cgroup accounting, so the runner has
      # to be able to provide it. `memory.peak` wants cgroup v2 on kernel >=
      # 5.19; GitHub's images are well past that, and failing here with a clear
      # message beats a later step quietly reporting a number about nothing.
      - name: Assert the runner exposes cgroup v2 memory.peak
        run: |
          set -euo pipefail
          if ! docker run --rm --cgroupns=private --entrypoint sh audio_proxy:capacity \
                 -c 'test -r /sys/fs/cgroup/memory.peak'; then
            echo "::error::runner has no readable cgroup v2 memory.peak (kernel $(uname -r))"
            exit 1
          fi

      # docs/capacity.md is what an operator sizes a container from, so it is
      # checked the way code is: its formula is evaluated against a real
      # concurrent workload — two-hour source included — on the real image, and
      # a memory term that grows outside the model fails the build. See that
      # document's "How this page is kept honest" for what the assertion means.
      - name: Check the published memory model
        run: SKIP_BUILD=1 IMAGE=audio_proxy:capacity bin/check-capacity

      # And the guard is itself guarded, because one whose tolerance has quietly
      # swallowed everything passes forever while saying nothing. This runs the
      # same workload against a model carrying no retention term at all — the
      # arithmetic a change that dropped or uncapped the backlog would produce —
      # and requires the guard to reject it.
      - name: Check that the guard can still fail
        run: SKIP_BUILD=1 IMAGE=audio_proxy:capacity bin/check-capacity --self-test

  license-compliance:
    name: the image carries its notices and its source manifest
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the release image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          tags: audio_proxy:license
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image distributes GPL binaries, so it has to ship the notices for
      # them. debian:slim strips /usr/share/doc but keeps the copyright files;
      # a future size pass that took the rest too would break the obligation
      # silently, which is what this asserts against. ffmpeg is named because
      # it is the GPL build and the reason any of this exists.
      - name: Assert the license notices survive
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh audio_proxy:license -c '
            set -eu
            test -s /usr/share/doc/ffmpeg/copyright || { echo "::error::/usr/share/doc/ffmpeg/copyright is missing or empty"; exit 1; }
            missing=0
            for pkg in $(dpkg-query -W -f="\${db:Status-Abbrev}\t\${Package}\n" | awk -F"\t" "\$1 ~ /^ii/ { print \$2 }"); do
              [ -s "/usr/share/doc/$pkg/copyright" ] || { echo "no copyright for $pkg"; missing=$((missing + 1)); }
            done
            echo "packages without a copyright file: $missing"
            [ "$missing" -eq 0 ] || { echo "::error::$missing installed packages ship no copyright file"; exit 1; }
          '

      # The manifest is the corresponding-source half of the obligation, and it
      # is only worth anything if it describes *this* image. Compared as sorted
      # package/version pairs against dpkg in the same container: a package
      # installed after the manifest step, or a manifest gone stale in a cached
      # layer, shows up as a diff rather than as a link nobody follows.
      - name: Assert the manifest matches the installed packages
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh audio_proxy:license -c '
            set -eu
            test -s /usr/share/audioproxy/SOURCES.txt || { echo "::error::/usr/share/audioproxy/SOURCES.txt is missing or empty"; exit 1; }
            grep -v "^#" /usr/share/audioproxy/SOURCES.txt | cut -f1,2 | sort > /tmp/manifest.txt
            dpkg-query -W -f="\${db:Status-Abbrev}\t\${Package}\t\${Version}\n" \
              | awk -F"\t" "\$1 ~ /^ii/ { print \$2 \"\t\" \$3 }" | sort > /tmp/installed.txt
            echo "manifest: $(wc -l < /tmp/manifest.txt) packages, dpkg: $(wc -l < /tmp/installed.txt)"
            diff -u /tmp/installed.txt /tmp/manifest.txt || { echo "::error::SOURCES.txt does not match dpkg (- installed, + manifest)"; exit 1; }
          '

      # GHCR prints the description label on the package page, which is where
      # someone decides whether to redistribute the image. If the pointer to
      # the manifest falls out of that label, the compliance story is still
      # true and nobody is told about it.
      - name: Assert the package description points at the manifest
        run: |
          set -euo pipefail
          description=$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.description"}}' audio_proxy:license)
          licenses=$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.licenses"}}' audio_proxy:license)
          echo "description: $description"
          echo "licenses:    $licenses"
          case "$description" in
            *SOURCES.txt*) ;;
            *) echo "::error::image description does not mention SOURCES.txt"; exit 1;;
          esac
          case "$licenses" in
            *GPL*) ;;
            *) echo "::error::image licenses label does not name the copyleft in the aggregate"; exit 1;;
          esac

      # And that the links in it resolve. Spot-checked rather than exhaustive:
      # 289 requests to Debian's archival service to prove a URL template is
      # not a check, it is a habit. ffmpeg is always among them; the first and
      # last entries move with the package set, so the sample is not frozen on
      # three packages that happen to be stable.
      #
      # A 404 here is a real failure and not flakiness to retry away: it means
      # either the URL form changed or a version reached the image before the
      # snapshot archived it, and both need a person.
      - name: Spot-check that the source URLs resolve
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh audio_proxy:license \
            -c 'grep -v "^#" /usr/share/audioproxy/SOURCES.txt | cut -f5' > urls.txt

          {
            grep -m1 '/package/ffmpeg/' urls.txt
            awk 'NR==1' urls.txt
            tail -n 1 urls.txt
          } | sort -u > sample.txt

          failed=0
          while read -r url; do
            code=$(curl -sS --retry 3 --retry-connrefused -o /dev/null -w '%{http_code}' "$url")
            echo "$code  $url"
            case "$code" in
              2*|3*) ;;
              *) failed=$((failed + 1));;
            esac
          done < sample.txt

          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed sampled source URL(s) did not resolve on snapshot.debian.org"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Publishing. Gated on everything above; never runs for a pull request, so a
  # fork cannot push and an unreviewed branch has nowhere to publish to.
  # ---------------------------------------------------------------------------

  publish:
    name: publish image to GHCR
    needs: [smoke, image-ffmpeg, capacity, license-compliance]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # A release names a version in two places. If they disagree, the image
      # would carry a version label nobody can trace back — fail before pushing,
      # not after.
      - name: Assert mix.exs version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          # Same reason as above: no `| head -1` under pipefail. `awk NR==1`
          # consumes its whole input, so nothing upstream ever sees EPIPE.
          mix_version=$(grep -oE 'version:[[:space:]]*"[^"]+"' mix.exs | awk 'NR==1' | grep -oE '"[^"]+"' | tr -d '"')
          echo "tag: $tag_version, mix.exs: $mix_version"
          if [ "$tag_version" != "$mix_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match mix.exs version $mix_version"
            exit 1
          fi

      # Tag rules, in one place rather than spread across a matrix:
      #   vX.Y.Z  -> :X.Y.Z, :X.Y, :latest
      #   main    -> :edge, :sha-<12>
      # The sha tag is the immutable one — it is what a deployment should pin
      # when it is not pinning a release.
      #
      # The shape check on the tag is load-bearing, not defensive tidiness. The
      # `v*` trigger also matches `v1.2.3-rc1` and `v1.2`, and plain suffix
      # stripping turned both into a `:latest` push: a release candidate would
      # have moved the tag everyone follows, and `v2.0.0-beta.1` would have
      # produced the nonsense `:2.0.0-beta`. Anything that is not exactly
      # X.Y.Z fails here rather than publishing something surprising.
      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          short_sha=$(printf '%s' "$GITHUB_SHA" | cut -c1-12)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z; pre-release and partial tags are not published"
              exit 1
            fi
            major_minor="${version%.*}"
            tags="${IMAGE_NAME}:${version},${IMAGE_NAME}:${major_minor},${IMAGE_NAME}:latest"
          else
            version="edge"
            tags="${IMAGE_NAME}:edge,${IMAGE_NAME}:sha-${short_sha}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publishing: $tags"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuilt rather than carried over from the smoke job: the layer cache
      # makes it cheap, and the alternative (exporting a tarball between jobs)
      # buys nothing since the inputs are byte-identical.
      #
      # `cache-from` only. The smoke and image-ffmpeg jobs already exported every
      # layer this build reads, in this same run, so exporting again would write
      # a cache nobody reads — and it would be the one cache write happening
      # under a narrowed `permissions:` block, which is a question not worth
      # having.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
