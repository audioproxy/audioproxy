name: CI

on:
  push:
    branches: [main]
    # Release tags run the same pipeline as any other push; the publish job at
    # the bottom is what reads the tag and turns it into version tags.
    tags: ['v*']
  pull_request:

env:
  MIX_ENV: test
  IMAGE_NAME: ghcr.io/audioproxy/audioproxy

jobs:
  test:
    name: format, compile, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Versions come from .tool-versions, the same pin mise reads locally.
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      - run: mix format --check-formatted

      - run: mix compile --warnings-as-errors

      # MinIO backs the :minio suite, which is where the S3 layer is checked
      # against a store that actually verifies signatures. Started with
      # `docker run` rather than as a `services:` container because the minio
      # image needs a command (`server /data`) and the services block has
      # nowhere to put one.
      - name: Start MinIO
        run: |
          set -euo pipefail

          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO is up"
              exit 0
            fi
            sleep 1
          done

          echo "::error::MinIO did not become healthy"
          docker logs minio
          exit 1

      # `--include integration` adds the socket-binding tests; `--include
      # minio` adds the ones needing the store above. :ffmpeg stays excluded
      # (that tag has its own job below).
      - run: mix test --include integration --include minio
        env:
          AP_TEST_MINIO_ENDPOINT: http://127.0.0.1:9000

  # ---------------------------------------------------------------------------
  # Image verification. Every job here builds from the same Dockerfile and
  # shares a buildx layer cache, so the second one to run pays for very little.
  #
  # **The image jobs run once per published architecture, on native hardware.**
  # A published tag is a manifest list holding linux/amd64 and linux/arm64, and
  # an architecture nobody has smoked is an architecture nobody has shipped: the
  # matrix below is what earns the second entry in that list. Native runners
  # rather than QEMU because emulated builds are 5-20x slower and the BEAM's JIT
  # under QEMU is a known flake source — the arm64 image is built and exercised
  # by an arm64 machine or not at all.
  #
  # The buildx cache is scoped by architecture and not by job. Two arches
  # sharing one scope evict each other on every run, because the layers differ
  # all the way down; two *jobs* of the same arch sharing one scope is the reuse
  # the paragraph above describes, and that is kept.
  #
  # `capacity` is deliberately outside the matrix, and not for cost. Its guard
  # already spans both architectures: the table in docs/capacity.md was measured
  # on arm64 and is asserted here on amd64, with the 1.5x headroom factor
  # covering exactly that gap. Running it on arm64 too would compare arm64
  # figures against themselves, which is a weaker claim than the one being made
  # now.
  # ---------------------------------------------------------------------------

  image-ffmpeg:
    name: ffmpeg-tagged tests against the shipped ffmpeg (${{ matrix.arch }})
    needs: test
    # fail-fast off throughout the image matrix: when one architecture goes red,
    # the other's result is what distinguishes an arch-specific break from a
    # real one, and cancelling it throws that away.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The runtime image is built here too, only so its ffmpeg can be compared
      # against the test stage's. That comparison is the whole point of the job:
      # the argv contract has to be checked against the binary that ships, not
      # against whatever the runner's apt happens to hold.
      - name: Build test stage
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          load: true
          tags: audio_proxy:test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Build runtime stage
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          tags: audio_proxy:runtime
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Assert the tested ffmpeg is the shipped ffmpeg
        run: |
          set -euo pipefail
          # Captured whole, then sliced to the first line with parameter
          # expansion. Piping into `head -1` closes the pipe after one line,
          # ffmpeg dies of EPIPE partway through its banner, docker exits
          # non-zero, and `pipefail` turns that into a failed step — a failure
          # about plumbing that reads exactly like a failed assertion.
          test_ffmpeg=$(docker run --rm --entrypoint ffmpeg audio_proxy:test -version)
          ship_ffmpeg=$(docker run --rm --entrypoint ffmpeg audio_proxy:runtime -version)
          test_ffmpeg=${test_ffmpeg%%$'\n'*}
          ship_ffmpeg=${ship_ffmpeg%%$'\n'*}
          echo "test stage:    $test_ffmpeg"
          echo "runtime stage: $ship_ffmpeg"
          if [ "$test_ffmpeg" != "$ship_ffmpeg" ]; then
            echo "::error::test and runtime stages ship different ffmpeg builds — check DEBIAN_VERSION in the Dockerfile"
            exit 1
          fi

          # VERSIONS.md is the single record of the pin; a bump that moves the
          # major has to move that file too, deliberately. The FFMPEG_MAJOR line
          # exists to be parsed — matching prose instead once meant reading a
          # restatement of the number rather than the number itself.
          expected=$(grep -oE '^[[:space:]]*FFMPEG_MAJOR=[0-9]+$' VERSIONS.md | grep -oE '[0-9]+$')
          actual=$(printf '%s' "$ship_ffmpeg" | grep -oE 'ffmpeg version [0-9]+' | grep -oE '[0-9]+$')
          echo "expected major: $expected, actual: $actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::ffmpeg major $actual does not match the $expected pinned in VERSIONS.md"
            exit 1
          fi

          # The full Debian version, kept for the parity job below. The version
          # token rather than the whole banner: the banner also names the gcc
          # that built it, which may legitimately differ between architectures
          # and is not what VERSIONS.md records.
          printf '%s\n' "$ship_ffmpeg" | awk '{ print $3 }' > ffmpeg-version.txt
          echo "recorded version: $(cat ffmpeg-version.txt)"

      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-version-${{ matrix.arch }}
          path: ffmpeg-version.txt
          if-no-files-found: error
          retention-days: 1

      - name: Run :ffmpeg-tagged tests in the image
        run: docker run --rm audio_proxy:test mix test --only ffmpeg

  # Debian builds one source version per suite, so the two architectures are
  # expected to carry the same ffmpeg — expected, not guaranteed: an arch can
  # lag a security upload by days. VERSIONS.md records one version because there
  # has only ever been one; this job is what makes that a checked claim rather
  # than an assumption, and the day it fails, that table grows a per-arch row
  # and the divergence is accepted deliberately or waited out.
  ffmpeg-arch-parity:
    name: both architectures ship the same ffmpeg
    needs: image-ffmpeg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: versions
          pattern: ffmpeg-version-*

      - name: Compare the recorded versions
        run: |
          set -euo pipefail

          amd64=$(cat versions/ffmpeg-version-amd64/ffmpeg-version.txt)
          arm64=$(cat versions/ffmpeg-version-arm64/ffmpeg-version.txt)
          echo "amd64: $amd64"
          echo "arm64: $arm64"

          # Non-empty as well as equal: two failed extractions would compare
          # equal and report parity having read nothing.
          if [ -z "$amd64" ] || [ -z "$arm64" ]; then
            echo "::error::an architecture recorded no ffmpeg version — the extraction in image-ffmpeg failed"
            exit 1
          fi

          if [ "$amd64" != "$arm64" ]; then
            echo "::error::ffmpeg differs across architectures (amd64 $amd64, arm64 $arm64) — record both in VERSIONS.md and decide deliberately"
            exit 1
          fi

  smoke:
    name: container smoke suite (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the release image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          tags: audio_proxy:smoke
          # The smoke image is never pushed, so its version label only has to be
          # non-empty for the label check; the publish job computes the real one.
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # Ruby is preinstalled on both runner images; the script needs no gems,
      # and it takes its ffmpeg from the image rather than the runner — which is
      # what makes this leg a claim about the arm64 artifact and not about the
      # arm64 runner.
      - name: Run the smoke suite
        run: SKIP_BUILD=1 IMAGE=audio_proxy:smoke bin/smoke-image

  capacity:
    name: the published memory model holds
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Before the image build, because it needs neither docker nor ffmpeg and
      # takes under a second: the matrix at the top of docs/capacity.md is the
      # model inverted, so every published cell has to fit the limit it is
      # printed under, and one more slot has to not fit. An inversion that has
      # drifted publishes a memory limit that is too small, which is the failure
      # mode an operator discovers as an OOM kill.
      - name: Check the published matrix inverts the model
        run: bin/capacity-matrix --verify

      - uses: docker/setup-buildx-action@v4

      - name: Build the release image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          tags: audio_proxy:capacity
          # amd64 only, so its scope is written out rather than taken from a
          # matrix this job does not have.
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      # The guard reads a container's own cgroup accounting, so the runner has
      # to be able to provide it. `memory.peak` wants cgroup v2 on kernel >=
      # 5.19; GitHub's images are well past that, and failing here with a clear
      # message beats a later step quietly reporting a number about nothing.
      - name: Assert the runner exposes cgroup v2 memory.peak
        run: |
          set -euo pipefail
          if ! docker run --rm --cgroupns=private --entrypoint sh audio_proxy:capacity \
                 -c 'test -r /sys/fs/cgroup/memory.peak'; then
            echo "::error::runner has no readable cgroup v2 memory.peak (kernel $(uname -r))"
            exit 1
          fi

      # docs/capacity.md is what an operator sizes a container from, so it is
      # checked the way code is: its formula is evaluated against a real
      # concurrent workload — two-hour source included — on the real image, and
      # a memory term that grows outside the model fails the build. See that
      # document's "How this page is kept honest" for what the assertion means.
      - name: Check the published memory model
        run: SKIP_BUILD=1 IMAGE=audio_proxy:capacity bin/check-capacity

      # And the guard is itself guarded, because one whose tolerance has quietly
      # swallowed everything passes forever while saying nothing. This runs the
      # same workload against a model carrying no retention term at all — the
      # arithmetic a change that dropped or uncapped the backlog would produce —
      # and requires the guard to reject it.
      - name: Check that the guard can still fail
        run: SKIP_BUILD=1 IMAGE=audio_proxy:capacity bin/check-capacity --self-test

  hex-package:
    name: the hex package is what we meant to ship
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      # Runs on every pull request and not only on a tag, which is the whole
      # point of it: a hex version is permanent, `mix hex.retire` marks a bad
      # one rather than removing it, so the tarball has to be wrong on a branch
      # — where it is free to fix — instead of on the tag that publishes it.
      #
      # Three claims, all in the script: the tarball holds the allowlist and
      # nothing else (LICENSE and the two llms files present; `openspec/`,
      # `test/`, `examples/`, `Dockerfile`, `.github/` absent at any depth), the
      # unpacked tarball compiles on its own outside this checkout — so "the
      # package builds for a consumer" is tested rather than inferred from a
      # list of filenames — and `mix docs` builds with every documented link
      # resolving, because `mix hex.publish` ships those docs too.
      - name: Build the package and check its contents
        run: bin/check-hex-package

  license-compliance:
    # Per arch, because the obligation is per artifact: SOURCES.txt is generated
    # inside the image from that image's own dpkg, so the arm64 manifest is a
    # different document listing different package versions. Checking one arch
    # and publishing two would leave half the distribution unverified.
    name: the image carries its notices and its source manifest (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the release image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          tags: audio_proxy:license
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # The image distributes GPL binaries, so it has to ship the notices for
      # them. debian:slim strips /usr/share/doc but keeps the copyright files;
      # a future size pass that took the rest too would break the obligation
      # silently, which is what this asserts against. ffmpeg is named because
      # it is the GPL build and the reason any of this exists.
      #
      # `checked` is not decoration. The assertion is "zero packages lack a
      # copyright file", which is vacuously true of zero packages: a dpkg-query
      # that failed would expand to an empty list, skip the loop, and report
      # compliance having examined nothing. A check that cannot fail is worse
      # than no check, so the count is asserted as well as the misses. `set -o
      # pipefail` in the inner shell for the same hazard — dash has supported it
      # since 0.5.12 and trixie carries it.
      - name: Assert the license notices survive
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh audio_proxy:license -c '
            set -eu
            set -o pipefail
            test -s /usr/share/doc/ffmpeg/copyright || { echo "::error::/usr/share/doc/ffmpeg/copyright is missing or empty"; exit 1; }
            missing=0
            checked=0
            for pkg in $(dpkg-query -W -f="\${db:Status-Abbrev}\t\${Package}\n" | awk -F"\t" "\$1 ~ /^ii/ { print \$2 }"); do
              checked=$((checked + 1))
              [ -s "/usr/share/doc/$pkg/copyright" ] || { echo "no copyright for $pkg"; missing=$((missing + 1)); }
            done
            echo "packages checked: $checked, without a copyright file: $missing"
            [ "$checked" -ge 50 ] || { echo "::error::only $checked packages examined — dpkg-query failed, so this check proved nothing"; exit 1; }
            [ "$missing" -eq 0 ] || { echo "::error::$missing installed packages ship no copyright file"; exit 1; }
          '

      # The manifest is the corresponding-source half of the obligation, and it
      # is only worth anything if it describes *this* image. Compared as sorted
      # package/version pairs against dpkg in the same container: a package
      # installed after the manifest step, or a manifest gone stale in a cached
      # layer, shows up as a diff rather than as a link nobody follows.
      #
      # Same vacuity guard as above, and for a sharper reason: `diff` of two
      # empty files exits 0, so a manifest of nothing against a dpkg of nothing
      # would agree perfectly.
      - name: Assert the manifest matches the installed packages
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh audio_proxy:license -c '
            set -eu
            set -o pipefail
            test -s /usr/share/audioproxy/SOURCES.txt || { echo "::error::/usr/share/audioproxy/SOURCES.txt is missing or empty"; exit 1; }
            grep -v "^#" /usr/share/audioproxy/SOURCES.txt | cut -f1,2 | sort > /tmp/manifest.txt
            dpkg-query -W -f="\${db:Status-Abbrev}\t\${Package}\t\${Version}\n" \
              | awk -F"\t" "\$1 ~ /^ii/ { print \$2 \"\t\" \$3 }" | sort > /tmp/installed.txt
            manifest=$(wc -l < /tmp/manifest.txt)
            installed=$(wc -l < /tmp/installed.txt)
            echo "manifest: $manifest packages, dpkg: $installed"
            [ "$installed" -ge 50 ] || { echo "::error::dpkg reported only $installed packages — this comparison proved nothing"; exit 1; }
            diff -u /tmp/installed.txt /tmp/manifest.txt || { echo "::error::SOURCES.txt does not match dpkg (- installed, + manifest)"; exit 1; }
          '

      # GHCR prints the description label on the package page, which is where
      # someone decides whether to redistribute the image. If the pointer to
      # the manifest falls out of that label, the compliance story is still
      # true and nobody is told about it.
      - name: Assert the package description points at the manifest
        run: |
          set -euo pipefail
          description=$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.description"}}' audio_proxy:license)
          licenses=$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.licenses"}}' audio_proxy:license)
          echo "description: $description"
          echo "licenses:    $licenses"
          case "$description" in
            *SOURCES.txt*) ;;
            *) echo "::error::image description does not mention SOURCES.txt"; exit 1;;
          esac
          case "$licenses" in
            *GPL*) ;;
            *) echo "::error::image licenses label does not name the copyleft in the aggregate"; exit 1;;
          esac

      # And that the links in it resolve. Spot-checked rather than exhaustive:
      # 289 requests to Debian's archival service to prove a URL template is
      # not a check, it is a habit. ffmpeg is always among them; the first and
      # last entries move with the package set, so the sample is not frozen on
      # three packages that happen to be stable.
      #
      # A 404 here is a real failure and not flakiness to retry away: it means
      # either the URL form changed or a version reached the image before the
      # snapshot archived it, and both need a person.
      #
      # `--location` and a 2xx-only verdict, because the archive answers an
      # unknown timestamp with a 302 to the nearest one it does have: accepting
      # 3xx would let "snapshot.debian.org recognised the shape of your URL"
      # pass for "the source is there". The base-image snapshot line is sampled
      # too — it is a claim in the manifest, so it is a claim CI checks, and it
      # is the one URL that reaches its answer through a redirect.
      - name: Spot-check that the source URLs resolve
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh audio_proxy:license \
            -c 'grep -v "^#" /usr/share/audioproxy/SOURCES.txt | cut -f5' > urls.txt

          if ! grep -q '/package/ffmpeg/' urls.txt; then
            echo "::error::no ffmpeg entry in SOURCES.txt — the GPL package this manifest exists for is unlisted"
            exit 1
          fi

          {
            grep -m1 '/package/ffmpeg/' urls.txt
            awk 'NR==1' urls.txt
            tail -n 1 urls.txt
            docker run --rm --entrypoint sh audio_proxy:license \
              -c 'grep -oE "https://snapshot.debian.org/archive/debian/[0-9TZ]+/" /usr/share/audioproxy/SOURCES.txt' || true
          } | sort -u > sample.txt

          failed=0
          while read -r url; do
            # `|| true` so a DNS blip or a reset connection is counted and
            # annotated below rather than killing the step under `set -e` with
            # nothing said. curl prints 000 on a transport failure, which falls
            # through to the failure branch on its own.
            code=$(curl -sSL --retry 3 --retry-connrefused -o /dev/null -w '%{http_code}' "$url" || true)
            echo "$code  $url"
            case "$code" in
              2*) ;;
              *) failed=$((failed + 1));;
            esac
          done < sample.txt

          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed sampled source URL(s) did not resolve on snapshot.debian.org"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Publishing, in three jobs rather than one, because the artifact is a
  # manifest list and a manifest list cannot be built by a single machine:
  #
  #   meta        — what this ref is called, computed once so the build and the
  #                 stitch cannot disagree about it
  #   image-build — one per architecture, on its own hardware, pushing an
  #                 *untagged* image and reporting its digest
  #   publish     — stitches those digests into one manifest list per tag, then
  #                 publishes the hex package on a tag
  #
  # That split is also the all-or-nothing gate. `image-build` pushes by digest,
  # so what reaches GHCR before the stitch is unreferenced by any tag and
  # unreachable by `docker pull`; if either architecture fails, `publish` never
  # runs and no tag moves. The alternative — tagging per arch and merging
  # afterwards — publishes a single-arch `:latest` for the width of the window
  # in between, which is precisely the state this change exists to remove.
  #
  # Gated on everything above; never runs for a pull request, so a fork cannot
  # push and an unreviewed branch has nowhere to publish to. The `if` lives on
  # `meta` alone: a skipped job skips everything downstream of it.
  # ---------------------------------------------------------------------------

  meta:
    name: compute the release version and tags
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tags.outputs.version }}
      tags: ${{ steps.tags.outputs.tags }}
      primary_tag: ${{ steps.tags.outputs.primary_tag }}
    steps:
      - uses: actions/checkout@v7

      # A release names a version in two places. If they disagree, the image
      # would carry a version label nobody can trace back — fail before pushing,
      # not after.
      #
      # The extraction is `bin/project-version` rather than an expression
      # inline here, and that is the whole lesson of v0.4.0's first two tags.
      # This step runs *only* on tags, so an expression that quietly stops
      # matching `mix.exs` cannot fail until a release: when `mix.exs` moved
      # its number into a `@version` attribute, the grep for `version: "…"`
      # returned nothing and the tag was compared against an empty string.
      # `bin/check-hex-package` calls the same script on every pull request, so
      # the extraction is now exercised long before a tag depends on it.
      - name: Assert mix.exs version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          mix_version=$(bin/project-version)
          echo "tag: $tag_version, mix.exs: $mix_version"
          if [ "$tag_version" != "$mix_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match mix.exs version $mix_version"
            exit 1
          fi

      # Tag rules, in one place rather than spread across a matrix:
      #   vX.Y.Z  -> :X.Y.Z, :X.Y, :latest
      #   main    -> :edge, :sha-<12>
      # The sha tag is the immutable one — it is what a deployment should pin
      # when it is not pinning a release.
      #
      # The shape check on the tag is load-bearing, not defensive tidiness. The
      # `v*` trigger also matches `v1.2.3-rc1` and `v1.2`, and plain suffix
      # stripping turned both into a `:latest` push: a release candidate would
      # have moved the tag everyone follows, and `v2.0.0-beta.1` would have
      # produced the nonsense `:2.0.0-beta`. Anything that is not exactly
      # X.Y.Z fails here rather than publishing something surprising.
      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          short_sha=$(printf '%s' "$GITHUB_SHA" | cut -c1-12)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z; pre-release and partial tags are not published"
              exit 1
            fi
            major_minor="${version%.*}"
            tags="${IMAGE_NAME}:${version},${IMAGE_NAME}:${major_minor},${IMAGE_NAME}:latest"
          else
            version="edge"
            tags="${IMAGE_NAME}:edge,${IMAGE_NAME}:sha-${short_sha}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The first tag, for the jobs that need *a* published reference rather
          # than all of them — the post-publish pull check below.
          echo "primary_tag=${tags%%,*}" >> "$GITHUB_OUTPUT"
          echo "publishing: $tags"

  image-build:
    name: build and push by digest (${{ matrix.arch }})
    needs: [meta, smoke, image-ffmpeg, ffmpeg-arch-parity, capacity, license-compliance, hex-package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuilt rather than carried over from the smoke job: the layer cache
      # makes it cheap, and the alternative (exporting a tarball between jobs)
      # buys nothing since the inputs are byte-identical.
      #
      # `cache-from` only. The smoke and image-ffmpeg jobs already exported every
      # layer this build reads, in this same run, on this same architecture, so
      # exporting again would write a cache nobody reads — and it would be the
      # one cache write happening under a narrowed `permissions:` block, which
      # is a question not worth having.
      #
      # No `tags:`. `push-by-digest=true` uploads the image and reports its
      # digest without naming it, which is what makes the stitch below the only
      # thing that can move a tag. `name-canonical=true` records the repository
      # in the descriptor so `imagetools` can resolve `<repo>@<digest>` later.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}

      # The digest travels as a filename, not as file contents: the stitch job
      # reconstructs `<image>@sha256:<name>` from whatever it downloads, so
      # merging the two artifact directories needs no parsing and no ordering.
      - name: Export the digest
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::build reported no digest — nothing to stitch"; exit 1;;
          esac
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"
          echo "$digest"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish image to GHCR and package to hex
    needs: [meta, image-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One `imagetools create` per run, carrying every tag: the tags of a
      # release are aliases for one manifest list, and creating them in one call
      # is what makes them incapable of pointing at different content.
      #
      # The count is asserted first. `merge-multiple` on a matrix leg that never
      # ran produces a directory with one file in it, and `imagetools create`
      # over a single digest succeeds — publishing exactly the single-arch
      # manifest this change exists to stop. The gate that catches that is this
      # number, not the `needs:` above.
      - name: Stitch the per-arch digests into one manifest list per tag
        env:
          TAGS: ${{ needs.meta.outputs.tags }}
        run: |
          set -euo pipefail
          cd /tmp/digests

          digests=(*)
          echo "digests: ${digests[*]}"
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "::error::expected 2 per-arch digests, got ${#digests[@]} — refusing to publish a partial manifest"
            exit 1
          fi

          refs=()
          for digest in "${digests[@]}"; do
            refs+=( "${IMAGE_NAME}@sha256:${digest}" )
          done

          tag_args=()
          IFS=',' read -r -a tags <<< "$TAGS"
          for tag in "${tags[@]}"; do
            tag_args+=( --tag "$tag" )
          done

          docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"

      # And read back what was actually published, rather than trusting the
      # command that wrote it. `unknown/unknown` entries are the provenance
      # attestations buildkit attaches to each image; they are platforms in the
      # descriptor and not architectures anybody pulls, so they are dropped
      # before the comparison.
      - name: Assert every published tag lists both platforms
        env:
          TAGS: ${{ needs.meta.outputs.tags }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a tags <<< "$TAGS"
          for tag in "${tags[@]}"; do
            platforms=$(
              docker buildx imagetools inspect "$tag" \
                --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}}{{"\n"}}{{end}}' \
                | grep -v '^unknown/unknown$' | sort -u | tr '\n' ' '
            )
            echo "$tag -> $platforms"
            for want in linux/amd64 linux/arm64; do
              case " $platforms " in
                *" $want "*) ;;
                *) echo "::error::$tag does not list $want"; exit 1;;
              esac
            done
          done

      # ---------------------------------------------------------------------
      # The hex package, on tags only. `main` publishes an `:edge` image and
      # nothing else: hex has no moving channel to push a pre-release commit
      # to, and the version in mix.exs has already been published by the time
      # the next commit lands on main.
      #
      # After the image push, sharing its gate rather than duplicating it: the
      # tag has already been asserted to match mix.exs above, so the image and
      # the package of one version cannot be different code.
      #
      # Package and docs are published as two steps, not by one bare
      # `mix hex.publish`, because their retry stories are opposite. A package
      # version can be overwritten only within an hour of publishing it and
      # only with `--replace`, so a second `mix hex.publish` on an
      # already-published version *fails*. Documentation has no such limit and
      # can be republished forever. Combined into one command, a docs failure
      # after a successful package upload left the release unrecoverable by
      # re-run: the retry died on the package half and never reached the docs.
      # Split, the docs step retries cleanly and the package step fails loudly
      # on a genuine duplicate, which is what it should do.
      # ---------------------------------------------------------------------
      - uses: erlef/setup-beam@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          version-file: .tool-versions
          version-type: strict

      # MIX_ENV=dev, against the workflow-level `test`: `mix hex.publish`
      # builds the docs as part of publishing, and ex_doc is a `only: :dev`
      # dependency, so the default env here would fail on a missing `mix docs`.
      - name: Publish the package to hex.pm
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MIX_ENV: dev
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          set -euo pipefail

          # A missing secret is a hard failure and not a skip. The tag has
          # already moved and the image has already published; a release that
          # quietly shipped one of its two artifacts is the state worth
          # failing loudly about.
          if [ -z "${HEX_API_KEY:-}" ]; then
            echo "::error::HEX_API_KEY is not set — see docs/development.md, 'The hex credentials'"
            exit 1
          fi

          mix deps.get
          mix hex.publish package --yes

      - name: Publish the docs to hexdocs.pm
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MIX_ENV: dev
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish docs --yes

  # ---------------------------------------------------------------------------
  # And the claim the manifest is actually making: that a plain `docker pull` on
  # an arm64 machine gets an arm64 image that boots. `imagetools inspect` above
  # reads a descriptor; this pulls the tag the way an operator does, on hardware
  # that has no amd64 emulation to fall back on, and waits for the release to
  # answer /health. A manifest listing a platform whose image does not run is a
  # worse failure than a manifest missing it.
  # ---------------------------------------------------------------------------

  verify-published:
    name: the published tag pulls and boots natively (${{ matrix.arch }})
    needs: [meta, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No `--platform`: taking the default is the whole assertion. What comes
      # back is then checked against the runner's own architecture, so a
      # manifest that resolved to the wrong image fails here rather than
      # silently running under emulation.
      - name: Pull the published tag and check what came back
        env:
          TAG: ${{ needs.meta.outputs.primary_tag }}
        run: |
          set -euo pipefail
          docker pull "$TAG"
          got=$(docker image inspect -f '{{.Architecture}}' "$TAG")
          echo "pulled architecture: $got, runner: ${{ matrix.arch }}"
          if [ "$got" != "${{ matrix.arch }}" ]; then
            echo "::error::$TAG resolved to $got on a ${{ matrix.arch }} runner"
            exit 1
          fi

      # AP_ALLOW_INSECURE and a local root are the README's quick start: the
      # smallest configuration that boots, since what is under test here is the
      # artifact rather than any behaviour the smoke suite already covers.
      - name: Boot it and wait for health
        env:
          TAG: ${{ needs.meta.outputs.primary_tag }}
        run: |
          set -euo pipefail
          docker run -d --name boot-check -p 4000:4000 \
            -e AP_ALLOW_INSECURE=true \
            -e AP_LOCAL_ROOT=/tmp \
            "$TAG"

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/health >/dev/null 2>&1; then
              echo "healthy"
              docker rm -f boot-check >/dev/null
              exit 0
            fi
            sleep 1
          done

          echo "::error::the published ${{ matrix.arch }} image did not become healthy"
          docker logs boot-check
          docker rm -f boot-check >/dev/null
          exit 1

      # The ffmpeg inside the *published* image, reported once per arch. Not an
      # assertion — image-ffmpeg and ffmpeg-arch-parity already made those, on
      # the same digests — but the line an operator reading a release run wants
      # when they ask which encoder a given tag carries.
      - name: Report the shipped ffmpeg
        env:
          TAG: ${{ needs.meta.outputs.primary_tag }}
        run: |
          set -euo pipefail
          banner=$(docker run --rm --entrypoint ffmpeg "$TAG" -version)
          echo "${banner%%$'\n'*}"
