version: 2

updates:
  # Minor and patch updates arrive as one PR per ecosystem per week; majors get
  # their own PR, since those are the ones that need reading. Every PR is gated
  # by ci.yml, so a grouped update that breaks the build fails visibly and gets
  # split by hand — rare enough to be cheaper than one PR per dependency.
  - package-ecosystem: mix
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      hex-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: ci
      include: scope
